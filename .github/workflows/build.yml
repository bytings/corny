jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your config
        uses: actions/checkout@v3

      - name: Clone ZMK
        run: git clone https://github.com/zmkfirmware/zmk.git zmk

      - name: Init west
        run: |
          pip3 install west
          west init -l app
          west update
        working-directory: zmk

      - name: Build firmware (Corne left)
        run: west build -p -b nice_nano -- -DSHIELD=corne_left
        working-directory: zmk

      - name: Upload firmware left
        uses: actions/upload-artifact@v4
        with:
          name: corne_left
          path: zmk/build/zephyr/*.uf2
