jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up ZMK
        uses: zmkfirmware/zmk@main

      - name: Build firmware
        run: west build -p -b nice_nano -- -DSHIELD=corne_left

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/**/*.uf2
