name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up west
        run: |
          pip3 install west
          west init -l app
          west update

      - name: Build firmware (Corne left)
        run: west build -p -b nice_nano -- -DSHIELD=corne_left

      - name: Upload firmware left
        uses: actions/upload-artifact@v4
        with:
          name: corne_left
          path: build/zephyr/*.uf2

      - name: Build firmware (Corne right)
        run: west build -p -b nice_nano -- -DSHIELD=corne_right

      - name: Upload firmware right
        uses: actions/upload-artifact@v4
        with:
          name: corne_right
          path: build/zephyr/*.uf2
